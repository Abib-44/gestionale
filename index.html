:root{

body{background:var(--bg);color:var(--text)}
.app{display:block;min-height:100vh}

function memberAnnualQuota(x){return Number(x.annualQuota!=null?x.annualQuota:(x.quota||0));}
function memberPaid(x){return Number(x.paidTotal!=null?x.paidTotal:(x.paid||0));}
function memberMonthlyQuota(x){var a=memberAnnualQuota(x);return a>0?a/12:0;}
function memberPaymentInfo(x){
 var annual=memberAnnualQuota(x),paid=memberPaid(x),monthly=memberMonthlyQuota(x);
 var months=monthly>0?Math.min(12,Math.floor((paid+0.000001)/monthly)):0;
 var remainder=monthly>0?Math.max(0,paid-months*monthly):0;
 var monthNames=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
 var reached=months>0?monthNames[months-1]:'Nessuno';
 var partialMonth=(remainder>0&&months<12)?monthNames[months]:'-';
 var remaining=Math.max(0,12-months-(remainder>0?1:0));
 var status=annual<=0?'Da definire':(paid+0.000001>=annual?'Pagato':'Non pagato');
 return {annual:annual,paid:paid,monthly:monthly,months:months,remainder:remainder,reached:reached,partialMonth:partialMonth,remaining:remaining,status:status};
}
function isSchoolFinanceMove(x){

}

}

GA.memberPaymentReceipt=function(recordId){

 var today=new Date().toISOString().slice(0,10);
 var receiptNo='SOC-'+String((DB.memberReceipts||[]).length+1).padStart(5,'0');

 var initial=monthly>0?Math.min(monthly,Math.max(0,memberAnnualQuota(x)-memberPaid(x))):0;
 var html='<div class="formgrid">'+
   f('memberName','Socio','text',x.name,true)+
   f('paymentDate','Data pagamento','date',today)+
   f('paymentAmount','Importo','number',initial||'',false)+
   f('paymentMethod','Tipo pagamento','select','Contanti',['Contanti','Bancomat'])+
   f('paymentCause','Causale','text','Donazione',false)+

   '</div>';
 openModal('Ricevuta',html,function(o){
   var amount=Number(o.paymentAmount||0);
   if(!o.paymentDate){alert('Inserisci la data del pagamento.');return false;}
   if(amount<=0){alert('Inserisci un importo maggiore di zero.');return false;}
   if(amount>Math.max(0,memberAnnualQuota(x)-memberPaid(x))+0.001){
      if(!confirm('L’importo supera la quota ancora da pagare. Vuoi registrarlo comunque?'))return false;
   }
   var receipt={id:id(),number:receiptNo,date:o.paymentDate,memberId:x.id,memberName:x.name,amount:amount,method:o.paymentMethod,cause:o.paymentCause||'Donazione'};
   if(!Array.isArray(DB.memberReceipts))DB.memberReceipts=[];
   DB.memberReceipts.push(receipt);
   x.paidTotal=memberPaid(x)+amount;
   x.paid=x.paidTotal;
   x.lastPay=o.paymentDate;
   x.lastReceiptNo=receiptNo;
   // Keep the payment in the general accounting as an association-membership income.
   DB.finance.push({id:id(),date:o.paymentDate,type:'Entrata',category:'Quote fisse',desc:'Donazione - '+x.name,amount:amount,method:o.paymentMethod,scope:'Tesoriere',receiptNumber:receiptNo});
   log('Pagamento socio','Ricevuta '+receiptNo+' - '+x.name+' - '+eur(amount));
   saveDB(DB);
   var body='<div style="max-width:680px;margin:0 auto">'+
     '<div style="display:flex;align-items:center;border-bottom:2px solid #d8c900;padding-bottom:14px;margin-bottom:18px">'+

     '<div><div style="font-size:20px;font-weight:700">Associazione Fratellanza e Uguaglianza</div><div style="font-size:13px;color:#666">Ricevuta</div></div></div>'+
     '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
     '<div><strong>N. ricevuta</strong><br>'+esc(receiptNo)+'</div>'+
     '<div><strong>Data</strong><br>'+esc(o.paymentDate)+'</div>'+
     '<div><strong>Socio</strong><br>'+esc(x.name)+'</div>'+
     '<div><strong>Tipo</strong><br>'+esc(x.memberType||'Socio')+'</div>'+
     '</div>'+
     '<div style="margin-top:24px;padding:18px;border:1px solid #ddd;border-radius:10px"><div style="font-size:13px;color:#666">Importo ricevuto</div><div style="font-size:30px;font-weight:800">'+eur(amount)+'</div><div style="margin-top:8px">Metodo di pagamento: <strong>'+esc(o.paymentMethod)+'</strong></div><div style="margin-top:6px">Causale: '+esc(o.paymentCause||'Donazione')+'</div></div>'+

   printDoc('Ricevuta '+receiptNo,body);
   render();
 });
};

   var html='<div class="table-wrap"><table class="table"><thead><tr><th>Alunno</th><th>Classe</th><th>Genitore</th><th>Quota</th><th>Pagato</th><th>Da pagare</th><th>Stato</th></tr></thead><tbody>'+pending.map(function(x){return '<tr><td>'+esc(x.first+' '+x.last)+'</td><td>'+esc(x.className)+'</td><td>'+esc(x.parent||'-')+'</td><td>'+eur(x.quota)+'</td><td>'+eur(x.paid)+'</td><td>'+eur(Number(x.quota||0)-Number(x.paid||0))+'</td><td>'+statusBadge('Non pagato')+'</td></tr>';}).join('')+'</tbody></table></div>';

 }

 html+='<div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrizione</th><th>Tipo pagamento</th><th>Importo</th></tr></thead><tbody>';
 html+=rows.sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));}).map(function(x){return '<tr><td>'+esc(x.date)+'</td><td>'+statusBadge(x.type)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.desc||'-')+'</td><td>'+esc(x.method||'-')+'</td><td>'+eur(x.amount)+'</td></tr>';}).join('');
 html+='</tbody></table></div>';

 }).join('');

     '<div style="margin-left:auto;text-align:right;font-size:12px;color:#666">Data emissione<br><strong style="color:#18202a">'+esc(reportDate)+'</strong></div></div>'+
     htmlTable(['Data','Tipo','Categoria','Descrizione','Tipo pagamento','Importo'],selected.map(function(x){return [x.date,x.type,x.category,x.desc,x.method||'-',eur(x.amount)];}))+
     '<div style="margin-top:18px;border:2px solid #222;border-radius:10px;padding:16px;display:flex;justify-content:space-between;align-items:center"><div style="font-size:13px;color:#666">Totale</div><div style="font-size:27px;font-weight:800">'+eur(net)+'</div></div>'+

   printDoc('Report',body);
   return;
 });
};GA.reportFinance=function(){var rows=financeRows(),en=0,us=0;rows.forEach(function(x){if(x.type==='Entrata')en+=Number(x.amount);else us+=Number(x.amount);});var totalText=isAdmin()?('<p>Entrate: '+eur(en)+'<br>Uscite: '+eur(us)+'<br><strong>Saldo: '+eur(en-us)+'</strong></p>'):'<p>Report limitato al proprio ambito economico. I totali generali dell’associazione sono riservati all’amministratore.</p>';printDoc('Bilancio mensile', '<h1>Bilancio mensile</h1>'+totalText+htmlTable(['Data','Tipo','Categoria','Descrizione','Metodo','Importo'],rows.map(function(x){return [x.date,x.type,x.category,x.desc,x.method||'',eur(x.amount)];})));};

function school(){
 if(!can('school','view')) return '<div class="card"><div class="empty">Accesso Scuola non autorizzato.</div></div>';
 var tab=S.schoolTab||'alunni';
 var tabs=[
  ['alunni','Alunni'],['presenze','Presenze'],['classi','Classi'],['lezioni','Lezioni'],['voti','Voti'],['materiali','Materiali'],['economia','Economia scuola']
 ];
 var nav='<div class="subtabs">'+tabs.map(function(t){return '<button type="button" class="tab '+(tab===t[0]?'active':'')+'" onclick="GA.schoolTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</div>';
 var body='';
 if(tab==='alunni') body=schoolStudents();
